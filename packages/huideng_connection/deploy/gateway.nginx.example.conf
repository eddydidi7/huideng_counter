# Preparation template ONLY. Replace both hostnames and install TLS certificates.
# This proxy must point to the SAME existing Supabase project, not a new project.
# Place the map in nginx's http context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl;
    server_name gateway.example.com;
    ssl_certificate /etc/letsencrypt/live/gateway.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.example.com/privkey.pem;
    client_max_body_size 1024m;
    access_log off;
    location / {
        proxy_pass https://YOUR_PROJECT.supabase.co;
        proxy_http_version 1.1;
        proxy_set_header Host YOUR_PROJECT.supabase.co;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_ssl_server_name on;
        proxy_ssl_name YOUR_PROJECT.supabase.co;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 8s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
